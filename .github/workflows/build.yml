name: Build release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, three numbers (e.g. 1.1.2). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write                    # needed to create the release and attach files

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and what to do
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            SOURCE=tag;    TAG="$GITHUB_REF_NAME"; V="${TAG#v}"
          else
            SOURCE=manual; V="${INPUT_VERSION#v}"; TAG="v$V"
          fi
          if [ -z "$V" ]; then TAG=""; fi
          BUILD=yes; NEW_RELEASE=true
          if [ -n "$V" ]; then
            if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The version must be three numbers like 1.1.2 (got '$V')"; exit 1
            fi
            if [ "$SOURCE" = manual ]; then
              if [ -n "$(git ls-remote --tags origin "refs/tags/v$V" "refs/tags/$V")" ]; then
                echo "::error::A release $V already exists (tag v$V or $V) - pick a higher version"; exit 1
              fi
            elif gh release view "$TAG" > /dev/null 2>&1; then
              NEW_RELEASE=false                      # you created this release yourself: only attach the files to it
              if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "Dynamic-Setup-$V.exe"; then
                BUILD=no; echo "::notice::$TAG already has its files - nothing to build"
              fi
            fi
          fi
          { echo "VERSION=$V"; echo "TAG=$TAG"; echo "BUILD=$BUILD"; echo "NEW_RELEASE=$NEW_RELEASE"; } >> "$GITHUB_ENV"
          {
            echo "### Dynamic build"
            if [ -n "$V" ]; then echo "- Version being built: **$V** (from the $SOURCE; tag \`$TAG\`)"; else echo "- Test build (no version typed): uses the version written in src/core/app_info.py"; fi
            if [ "$BUILD" = no ]; then echo "- Skipped: the release already has its files"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: ${{ env.BUILD != 'no' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the Python packages
        if: ${{ env.BUILD != 'no' }}
        run: python -m pip install -r requirements.txt

      - name: Install the current Inno Setup
        if: ${{ env.BUILD != 'no' }}
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress

      - name: Build (app + installer + update zip)
        if: ${{ env.BUILD != 'no' }}
        shell: bash
        run: |
          if [ -n "$VERSION" ]; then python build.py --ci --version "$VERSION"; else python build.py --ci; fi

      - name: List what was built
        if: ${{ env.BUILD != 'no' }}
        shell: pwsh
        run: Get-ChildItem dist, Output | Where-Object { -not $_.PSIsContainer } | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Keep the files (test build)
        if: ${{ env.BUILD != 'no' && env.VERSION == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-test-build
          path: |
            Output/*.exe
            dist/*-update.zip
            Output/*.sha256.txt
            dist/*.sha256.txt

      - name: Attach to the release
        if: ${{ env.BUILD != 'no' && env.VERSION != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          draft: ${{ env.NEW_RELEASE == 'true' && 'true' || '' }}
          name: ${{ env.NEW_RELEASE == 'true' && format('Dynamic {0}', env.VERSION) || '' }}
          generate_release_notes: ${{ env.NEW_RELEASE == 'true' }}
          fail_on_unmatched_files: false        # the first version (1.1.0) has no update zip; build.py --ci checks the rest
          files: |
            Output/*.exe
            dist/*-update.zip
            Output/*.sha256.txt
            dist/*.sha256.txt
